name: Reusable Deploy (SoEasy)

on:
  workflow_call:
    inputs:
      build_cmd:
        required: true
        type: string
      deploy_path:
        required: true
        type: string
      pre_build:
        required: false
        type: string
        default: ""
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      SSH_HOST:
        required: true
      SSH_PORT:
        required: true
      SSH_USER:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y rsync openssh-client

      - name: Run pre-build
        if: ${{ inputs.pre_build != '' }}
        run: bash -c "${{ inputs.pre_build }}"

      - name: Build
        run: bash -c "${{ inputs.build_cmd }}"

      - name: Debug build output
        run: ls -R .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            ./dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ inputs.deploy_path }}/
